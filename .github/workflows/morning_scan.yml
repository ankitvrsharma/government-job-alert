name: Morning recruitment scan

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: government-job-alert-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate JSON
        run: |
          python -m json.tool sources/sources.json > /dev/null
          python -m json.tool data/review_queue.json > /dev/null
          python -m json.tool data/seen_items.json > /dev/null
      - name: Run recruitment scan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS }}
          MAX_AI_REQUESTS_PER_SCAN: "45"
          SCAN_TIME_BUDGET_SECONDS: "1320"
        run: python -m engine.run_scan
      - name: Sync protected Supabase review queue
        if: success() && env.SUPABASE_SERVICE_ROLE_KEY != ''
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m engine.sync_supabase
      - name: Commit review queue and logs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/review_queue.json data/seen_items.json
          if [ -f data/review_queue.csv ]; then git add data/review_queue.csv; fi
          git diff --cached --quiet || git commit -m "Update recruitment review queue"
          git push
